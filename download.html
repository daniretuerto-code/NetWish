<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetWish — Descarga Segura</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-black flex items-center justify-center min-h-[100dvh] font-sans p-4">
    <div class="text-center space-y-4 max-w-sm w-full">
        <div class="w-12 h-12 bg-black text-white rounded-2xl flex items-center justify-center mx-auto font-black italic shadow-md">NW</div>
        <h2 class="text-base font-bold tracking-tight">Preparando tu descarga...</h2>
        <p class="text-xs text-neutral-500 leading-relaxed" id="downloadStatus">Tu archivo master se descargará automáticamente en unos segundos.</p>
        <a id="directLink" href="#" class="hidden inline-block px-6 py-3 bg-black text-white font-bold rounded-xl text-xs shadow-md transition active:scale-95">Descargar Manualmente</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const fileUrl = params.get('url');
        const fileName = params.get('name') || 'beat-master.mp3';

        if (fileUrl) {
            fetch(fileUrl)
                .then(response => {
                    if (!response.ok) throw new Error('Error al descargar archivo');
                    return response.blob();
                })
                .then(blob => {
                    const blobUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = blobUrl;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(blobUrl);
                    document.body.removeChild(a);
                    document.getElementById('downloadStatus').innerText = "¡Descarga completada! Ya puedes cerrar esta ventana.";
                })
                .catch(err => {
                    console.error("Error en blob, activando enlace directo:", err);
                    document.getElementById('downloadStatus').innerText = "Haz clic en el botón inferior si la descarga no inicia:";
                    const directBtn = document.getElementById('directLink');
                    directBtn.href = fileUrl;
                    directBtn.setAttribute('download', fileName);
                    directBtn.classList.remove('hidden');
                });
        } else {
            document.getElementById('downloadStatus').innerText = "Enlace no válido o expirado.";
        }
    </script>
</body>
</html>
