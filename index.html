<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NetWish — Palencia</title>

    <!-- PWA / Pantalla completa móvil -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f8f9fa">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0a0a0a',
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Librería QRCode.js real y válida -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        html { background-color: #f0f2f5; }
        body { 
            background-color: #f0f2f5; 
            color: #111111; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0;
            padding: 0;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .glass-dark {
            background: linear-gradient(135deg, #111111 0%, #1c1c1e 100%);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <!-- Contenedor Principal App Shell -->
    <div class="w-full h-[100dvh] sm:h-[844px] sm:max-w-[390px] sm:rounded-[48px] bg-white flex flex-col relative shadow-[0_30px_90px_rgba(0,0,0,0.12)] overflow-hidden sm:border-[8px] sm:border-neutral-900">
        
        <!-- HEADER SUPERIOR FIJO -->
        <header class="absolute top-0 left-0 right-0 px-6 pt-8 pb-3 border-b border-neutral-100/80 flex justify-between items-center glass-panel z-30">
            <h1 class="text-2xl font-bold tracking-tight text-black font-serif italic">NetWish</h1>
            <button onclick="handleHeaderProfileClick()" id="headerAvatar" class="w-9 h-9 rounded-2xl bg-neutral-100 border border-neutral-200/60 flex items-center justify-center text-xs font-bold text-black shadow-inner transition hover:scale-105 active:scale-95">
                IN
            </button>
        </header>

        <!-- CONTENIDO PRINCIPAL DINÁMICO -->
        <main class="flex-1 overflow-y-auto no-scrollbar px-6 pt-20 pb-28 flex flex-col">
            
            <!-- VISTA 1: INICIO -->
            <div id="view-home" class="space-y-5 w-full pt-2">
                <!-- Tarjeta Principal: Recibe tu pago -->
                <section class="glass-dark p-6 rounded-[32px] text-white flex flex-col justify-between space-y-5 relative overflow-hidden shadow-xl">
                    <div class="absolute -right-10 -top-10 w-36 h-36 bg-gradient-to-br from-neutral-700/30 to-transparent rounded-full blur-2xl pointer-events-none"></div>
                    
                    <div class="flex justify-between items-start relative z-10">
                        <div>
                            <span class="text-[9px] text-neutral-400 font-mono tracking-widest uppercase bg-white/10 px-2.5 py-1 rounded-full border border-white/5">IDENTIFICACIÓN URBANA</span>
                            <h2 class="text-lg font-medium tracking-tight mt-2 text-white">Recibe tu pago</h2>
                        </div>
                        <div class="w-10 h-10 rounded-2xl bg-white/10 border border-white/10 flex items-center justify-center backdrop-blur-md">
                            <i data-lucide="qr-code" class="w-5 h-5 text-white"></i>
                        </div>
                    </div>

                    <button onclick="openPersonalQR()" class="w-full py-3.5 bg-white text-black font-semibold rounded-2xl text-xs tracking-wide transition hover:bg-neutral-100 active:scale-[0.98] relative z-10 shadow-lg flex items-center justify-center space-x-2">
                        <i data-lucide="qr-code" class="w-4 h-4"></i>
                        <span>Mostrar código QR</span>
                    </button>
                </section>

                <!-- Sección de Servicios -->
                <div class="space-y-3">
                    <div class="flex justify-between items-center px-1">
                        <h3 class="text-[10px] font-mono uppercase tracking-widest text-neutral-400">Servicios Activos</h3>
                        <span class="text-[9px] font-mono text-emerald-600 bg-emerald-50 px-2.5 py-0.5 rounded-full border border-emerald-200/60 flex items-center space-x-1">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                            <span>Online</span>
                        </span>
                    </div>

                    <!-- Grid de Categorías -->
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="openModal('Comercios & Click&Collect')" class="group p-4 rounded-3xl bg-neutral-50/80 border border-neutral-200/70 hover:border-black/30 hover:bg-white transition-all duration-200 text-left active:scale-[0.97] shadow-sm flex flex-col justify-between h-24">
                            <div class="w-9 h-9 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center shrink-0 transition-transform group-hover:scale-110">
                                <i data-lucide="store" class="w-4 h-4 text-amber-600"></i>
                            </div>
                            <div>
                                <span class="block text-xs font-bold text-black tracking-tight">Comercios</span>
                                <span class="block text-[10px] text-neutral-400 mt-0.5">Pan y stock local</span>
                            </div>
                        </button>

                        <button onclick="openModal('Restaurantes & Cuentas')" class="group p-4 rounded-3xl bg-neutral-50/80 border border-neutral-200/70 hover:border-black/30 hover:bg-white transition-all duration-200 text-left active:scale-[0.97] shadow-sm flex flex-col justify-between h-24">
                            <div class="w-9 h-9 rounded-xl bg-rose-500/10 border border-rose-500/20 flex items-center justify-center shrink-0 transition-transform group-hover:scale-110">
                                <i data-lucide="utensils" class="w-4 h-4 text-rose-600"></i>
                            </div>
                            <div>
                                <span class="block text-xs font-bold text-black tracking-tight">Restaurantes</span>
                                <span class="block text-[10px] text-neutral-400 mt-0.5">QR mesa y carta</span>
                            </div>
                        </button>

                        <button onclick="openModal('Movilidad Urbana')" class="group p-4 rounded-3xl bg-neutral-50/80 border border-neutral-200/70 hover:border-black/30 hover:bg-white transition-all duration-200 text-left active:scale-[0.97] shadow-sm flex flex-col justify-between h-24">
                            <div class="w-9 h-9 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center shrink-0 transition-transform group-hover:scale-110">
                                <i data-lucide="car" class="w-4 h-4 text-emerald-600"></i>
                            </div>
                            <div>
                                <span class="block text-xs font-bold text-black tracking-tight">Movilidad</span>
                                <span class="block text-[10px] text-neutral-400 mt-0.5">Taxis y bus GPS</span>
                            </div>
                        </button>

                        <button onclick="openModal('Peluquería & Reservas')" class="group p-4 rounded-3xl bg-neutral-50/80 border border-neutral-200/70 hover:border-black/30 hover:bg-white transition-all duration-200 text-left active:scale-[0.97] shadow-sm flex flex-col justify-between h-24">
                            <div class="w-9 h-9 rounded-xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center shrink-0 transition-transform group-hover:scale-110">
                                <i data-lucide="scissors" class="w-4 h-4 text-blue-600"></i>
                            </div>
                            <div>
                                <span class="block text-xs font-bold text-black tracking-tight">Peluquería</span>
                                <span class="block text-[10px] text-neutral-400 mt-0.5">Reservas express</span>
                            </div>
                        </button>
                    </div>

                    <button onclick="openModal('Ocio y Experiencias')" class="w-full group p-4 rounded-3xl bg-neutral-50/80 border border-neutral-200/70 hover:border-black/30 hover:bg-white transition-all duration-200 text-left active:scale-[0.98] shadow-sm flex items-center justify-between">
                        <div class="flex items-center space-x-3.5">
                            <div class="w-10 h-10 rounded-2xl bg-purple-500/10 border border-purple-500/20 flex items-center justify-center shrink-0 transition-transform group-hover:scale-110">
                                <i data-lucide="sparkles" class="w-5 h-5 text-purple-600"></i>
                            </div>
                            <div>
                                <span class="block text-xs font-bold text-black tracking-tight">Ocio y Experiencias en Palencia</span>
                                <span class="block text-[10px] text-neutral-400 mt-0.5">Eventos, cultura y planes urbanos</span>
                            </div>
                        </div>
                        <div class="w-7 h-7 rounded-full bg-neutral-100 flex items-center justify-center text-neutral-400 group-hover:bg-black group-hover:text-white transition shrink-0">
                            <i data-lucide="chevron-right" class="w-4 h-4"></i>
                        </div>
                    </button>
                </div>
            </div>

            <!-- VISTA 2: EXPLORAR -->
            <div id="view-explore" class="space-y-5 hidden w-full pt-4 text-center">
                <div class="space-y-1">
                    <h2 class="text-lg font-bold text-black tracking-tight">Explora tu ciudad</h2>
                    <p class="text-xs text-neutral-500">Busca comercios, locales y servicios.</p>
                </div>
                <div class="relative flex items-center shadow-sm">
                    <i data-lucide="search" class="absolute left-4 w-4 h-4 text-neutral-400"></i>
                    <input type="text" placeholder="Buscar panaderías, taxis, peluquerías..." class="w-full bg-neutral-50 border border-neutral-200/80 rounded-2xl py-3.5 pl-11 pr-4 text-xs text-black placeholder-neutral-400 focus:outline-none focus:border-black transition">
                </div>
                <div class="p-8 rounded-[32px] bg-neutral-50/60 border border-neutral-200/60 text-center space-y-3">
                    <div class="w-12 h-12 rounded-2xl bg-neutral-100 flex items-center justify-center mx-auto text-neutral-400">
                        <i data-lucide="compass" class="w-6 h-6"></i>
                    </div>
                    <p class="text-xs font-medium text-neutral-600">Directorio urbano inteligente en tiempo real.</p>
                </div>
            </div>

            <!-- VISTA 3: QR (Cámara) -->
            <div id="view-scan" class="space-y-6 hidden text-center py-16 my-auto w-full">
                <div class="w-16 h-16 rounded-[28px] bg-black text-white flex items-center justify-center mx-auto shadow-xl">
                    <i data-lucide="scan" class="w-8 h-8"></i>
                </div>
                <div class="space-y-1.5">
                    <h2 class="text-sm font-bold text-black">Cámara de Escaneo QR</h2>
                    <p class="text-xs text-neutral-500 px-6">Apunta al código QR del establecimiento para realizar pagos o gestionar pedidos.</p>
                </div>
                <button onclick="startCameraModal()" class="px-6 py-3.5 bg-black text-white rounded-2xl text-xs font-semibold transition hover:bg-neutral-800 shadow-md">
                    Activar Cámara
                </button>
            </div>

            <!-- VISTA 4: PERFIL -->
            <div id="view-profile" class="space-y-5 hidden w-full pt-4">
                <div id="profileContentContainer" class="w-full">
                    <!-- Se inyecta por JS de forma segura -->
                </div>
            </div>

        </main>

        <!-- BARRA DE NAVEGACIÓN INFERIOR -->
        <nav class="absolute bottom-4 left-4 right-4 border border-neutral-200/80 bg-white/90 backdrop-blur-2xl px-6 py-3.5 rounded-[32px] flex justify-around items-center z-30 shadow-[0_10px_30px_rgba(0,0,0,0.06)]">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-black space-y-1 transition group">
                <i data-lucide="home" class="w-5 h-5 transition-transform group-active:scale-90"></i>
                <span class="text-[9px] font-medium tracking-tight">Inicio</span>
            </button>
            <button onclick="switchTab('explore')" id="nav-explore" class="flex flex-col items-center text-neutral-400 hover:text-black transition space-y-1 group">
                <i data-lucide="compass" class="w-5 h-5 transition-transform group-active:scale-90"></i>
                <span class="text-[9px] font-medium tracking-tight">Explorar</span>
            </button>
            <button onclick="switchTab('scan')" id="nav-scan" class="flex flex-col items-center text-neutral-400 hover:text-black transition space-y-1 group">
                <i data-lucide="scan" class="w-5 h-5 transition-transform group-active:scale-90"></i>
                <span class="text-[9px] font-medium tracking-tight">QR</span>
            </button>
            <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center text-neutral-400 hover:text-black transition space-y-1 group">
                <i data-lucide="user" class="w-5 h-5 transition-transform group-active:scale-90"></i>
                <span class="text-[9px] font-medium tracking-tight">Perfil</span>
            </button>
        </nav>

        <!-- VENTANA MODAL DINÁMICA -->
        <div id="customModal" class="absolute inset-0 bg-black/60 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
            <div class="bg-white w-full max-w-md rounded-[36px] p-6 text-center space-y-4 shadow-[0_25px_60px_rgba(0,0,0,0.25)] scale-95 transition-transform duration-300 border border-neutral-100 overflow-hidden" id="modalContent">
                
                <div id="modalBody" class="space-y-4">
                    <!-- Contenido dinámico -->
                </div>

                <button id="modalCloseBtn" onclick="closeModal()" class="w-full py-3.5 bg-black text-white font-medium rounded-2xl text-xs tracking-wide transition hover:bg-neutral-800 active:scale-[0.98]">
                    Cerrar / Entendido
                </button>
            </div>
        </div>

    </div>

    <!-- SCRIPT DE LÓGICA DE AUTENTICACIÓN REAL Y VALIDACIÓN -->
    <script>
        lucide.createIcons();

        let currentUser = JSON.parse(localStorage.getItem('netwish_session')) || null;
        let registeredUsers = JSON.parse(localStorage.getItem('netwish_db_users')) || [];

        document.addEventListener('DOMContentLoaded', () => {
            updateHeaderAvatar();
            renderProfileView();
        });

        function updateHeaderAvatar() {
            const avatarBtn = document.getElementById('headerAvatar');
            if (currentUser) {
                avatarBtn.innerText = currentUser.initials;
                avatarBtn.className = "w-9 h-9 rounded-2xl bg-black text-white border border-neutral-800 flex items-center justify-center text-xs font-bold shadow-md transition hover:scale-105 active:scale-95";
            } else {
                avatarBtn.innerText = "IN";
                avatarBtn.className = "w-9 h-9 rounded-2xl bg-neutral-100 border border-neutral-200/60 flex items-center justify-center text-xs font-bold text-black shadow-inner transition hover:scale-105 active:scale-95";
            }
        }

        function handleHeaderProfileClick() {
            switchTab('profile');
        }

        function renderProfileView() {
            const container = document.getElementById('profileContentContainer');

            if (currentUser) {
                container.innerHTML = `
                    <div class="flex items-center space-x-4 p-5 rounded-[32px] bg-neutral-50/80 border border-neutral-200/60 shadow-sm">
                        <div class="w-12 h-12 rounded-2xl bg-black text-white flex items-center justify-center font-bold text-xs shadow-md shrink-0">
                            ${currentUser.initials}
                        </div>
                        <div class="overflow-hidden text-left">
                            <h2 class="text-xs font-bold text-black truncate">${currentUser.name}</h2>
                            <p class="text-[10px] text-neutral-500 truncate">${currentUser.email}</p>
                        </div>
                    </div>

                    <div class="space-y-2 pt-2">
                        <span class="text-[9px] font-mono uppercase tracking-widest text-neutral-400 px-1">Configuración</span>
                        <div class="bg-neutral-50/80 border border-neutral-200/60 rounded-[32px] overflow-hidden shadow-sm">
                            <button onclick="openModal('Métodos de Pago')" class="w-full px-5 py-4 text-left flex justify-between items-center hover:bg-neutral-100/60 transition border-b border-neutral-200/60">
                                <span class="text-xs font-bold text-black">Métodos de pago seguros</span>
                                <i data-lucide="chevron-right" class="w-4 h-4 text-neutral-400 shrink-0"></i>
                            </button>
                            <button onclick="openModal('Mis Reservas')" class="w-full px-5 py-4 text-left flex justify-between items-center hover:bg-neutral-100/60 transition border-b border-neutral-200/60">
                                <span class="text-xs font-bold text-black">Mis reservas y tickets</span>
                                <i data-lucide="chevron-right" class="w-4 h-4 text-neutral-400 shrink-0"></i>
                            </button>
                            <button onclick="logoutUser()" class="w-full px-5 py-4 text-left flex justify-between items-center hover:bg-rose-50/60 transition text-rose-600">
                                <span class="text-xs font-bold">Cerrar sesión</span>
                                <i data-lucide="log-out" class="w-4 h-4 shrink-0"></i>
                            </button>
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="p-8 rounded-[32px] bg-neutral-50/80 border border-neutral-200/60 text-center space-y-4 shadow-sm">
                        <div class="w-14 h-14 rounded-2xl bg-black text-white flex items-center justify-center mx-auto shadow-md">
                            <i data-lucide="user" class="w-6 h-6"></i>
                        </div>
                        <div class="space-y-1">
                            <h2 class="text-sm font-bold text-black">Inicia sesión en NetWish</h2>
                            <p class="text-xs text-neutral-500">Accede a tu cuenta o regístrate para gestionar tus pagos y códigos QR urbanos.</p>
                        </div>
                        <div class="space-y-2 pt-2">
                            <button onclick="openAuthModal('login')" class="w-full py-3.5 bg-black text-white font-semibold rounded-2xl text-xs tracking-wide transition hover:bg-neutral-800 shadow-md">
                                Iniciar Sesión
                            </button>
                            <button onclick="openAuthModal('register')" class="w-full py-3.5 bg-neutral-100 text-black font-semibold rounded-2xl text-xs tracking-wide transition hover:bg-neutral-200 border border-neutral-200">
                                Registrarse
                            </button>
                        </div>
                    </div>
                `;
            }
            lucide.createIcons();
        }

        // Modal que diferencia de forma real entre Login y Registro
        function openAuthModal(mode) {
            const modal = document.getElementById('customModal');
            const modalContent = document.getElementById('modalContent');
            const modalBody = document.getElementById('modalBody');
            const closeBtn = document.getElementById('modalCloseBtn');
            
            closeBtn.style.display = 'none';
            const isLogin = mode === 'login';

            modalBody.innerHTML = `
                <div class="space-y-4 text-left">
                    <div class="text-center space-y-1">
                        <h3 class="text-base font-bold text-black">${isLogin ? 'Iniciar Sesión en NetWish' : 'Crear Cuenta Nueva'}</h3>
                        <p class="text-xs text-neutral-500">${isLogin ? 'Introduce tus credenciales registradas.' : 'Completa los datos para darte de alta.'}</p>
                    </div>
                    <div class="space-y-3 pt-2">
                        ${!isLogin ? `
                        <div>
                            <label class="text-[10px] font-mono uppercase text-neutral-400 block mb-1">Nombre Completo</label>
                            <input type="text" id="authName" placeholder="Ej. Daniel Retuerto" class="w-full bg-neutral-50 border border-neutral-200 rounded-2xl py-3 px-4 text-xs text-black focus:outline-none focus:border-black">
                        </div>
                        ` : ''}
                        <div>
                            <label class="text-[10px] font-mono uppercase text-neutral-400 block mb-1">Correo Electrónico</label>
                            <input type="email" id="authEmail" placeholder="correo@ejemplo.com" class="w-full bg-neutral-50 border border-neutral-200 rounded-2xl py-3 px-4 text-xs text-black focus:outline-none focus:border-black">
                        </div>
                        <div>
                            <label class="text-[10px] font-mono uppercase text-neutral-400 block mb-1">Contraseña</label>
                            <input type="password" id="authPass" placeholder="Mínimo 6 caracteres" class="w-full bg-neutral-50 border border-neutral-200 rounded-2xl py-3 px-4 text-xs text-black focus:outline-none focus:border-black">
                        </div>
                    </div>
                    <button onclick="processStrictAuth('${mode}')" class="w-full py-3.5 bg-black text-white font-semibold rounded-2xl text-xs tracking-wide transition hover:bg-neutral-800 shadow-md mt-2">
                        ${isLogin ? 'Entrar a mi Cuenta' : 'Registrarse Ahora'}
                    </button>
                    <button onclick="closeModal()" class="w-full py-2 text-neutral-400 font-medium text-xs transition hover:text-black">
                        Cancelar
                    </button>
                </div>
            `;
            lucide.createIcons();

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
            }, 10);
        }

        // Validación estricta con comprobación real de la base de datos local
        function processStrictAuth(mode) {
            const email = document.getElementById('authEmail').value.trim();
            const pass = document.getElementById('authPass').value.trim();
            const name = mode === 'register' ? document.getElementById('authName').value.trim() : '';

            // Comprobaciones básicas de formato
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email || !emailRegex.test(email)) {
                alert("Por favor, introduce un correo electrónico válido.");
                return;
            }
            if (!pass || pass.length < 6) {
                alert("La contraseña debe tener al menos 6 caracteres.");
                return;
            }

            if (mode === 'register') {
                if (!name) {
                    alert("Por favor, introduce tu nombre completo.");
                    return;
                }
                // Comprobar si el correo ya existe en la base de datos
                let existingUser = registeredUsers.find(u => u.email === email);
                if (existingUser) {
                    alert("Este correo ya está registrado. Por favor, inicia sesión.");
                    openAuthModal('login');
                    return;
                }

                // Crear nuevo usuario real
                const initials = name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
                currentUser = {
                    name: name,
                    email: email,
                    pass: pass,
                    initials: initials,
                    id: 'NW-' + initials + '-' + Math.floor(1000 + Math.random() * 9000)
                };
                registeredUsers.push(currentUser);
                localStorage.setItem('netwish_db_users', JSON.stringify(registeredUsers));
                alert("¡Cuenta creada con éxito! Bienvenido a NetWish.");

            } else {
                // Modo Iniciar Sesión: comprobar que el usuario exista y la contraseña sea correcta
                let foundUser = registeredUsers.find(u => u.email === email);
                if (!foundUser) {
                    alert("No existe ninguna cuenta registrada con este correo.");
                    return;
                }
                if (foundUser.pass !== pass) {
                    alert("Contraseña incorrecta. Comprueba tus datos.");
                    return;
                }
                currentUser = foundUser;
                alert("¡Sesión iniciada correctamente!");
            }

            // Guardar sesión activa y actualizar interfaz
            localStorage.setItem('netwish_session', JSON.stringify(currentUser));
            closeModal();
            updateHeaderAvatar();
            renderProfileView();
            switchTab('home');
        }

        function logoutUser() {
            localStorage.removeItem('netwish_session');
            currentUser = null;
            updateHeaderAvatar();
            renderProfileView();
            switchTab('profile');
        }

        function openPersonalQR() {
            if (!currentUser) {
                openAuthModal('login');
                return;
            }

            const modal = document.getElementById('customModal');
            const modalContent = document.getElementById('modalContent');
            const modalBody = document.getElementById('modalBody');
            const closeBtn = document.getElementById('modalCloseBtn');
            
            closeBtn.style.display = 'block';

            modalBody.innerHTML = `
                <div class="space-y-3 text-center">
                    <h3 class="text-base font-bold text-black">Tu Código QR Personal</h3>
                    <p class="text-xs text-neutral-500">Muestra este código seguro para recibir pagos en Palencia.</p>
                    <div id="realQRCodeContainer" class="w-48 h-48 bg-white border-2 border-neutral-200 rounded-3xl mx-auto flex items-center justify-center p-3 relative shadow-sm"></div>
                    <div class="p-3 bg-neutral-50 rounded-2xl border border-neutral-200/60">
                        <span class="block text-xs font-bold text-black">${currentUser.name}</span>
                        <span class="block text-[10px] text-neutral-400 font-mono">ID: ${currentUser.id}</span>
                    </div>
                </div>
            `;
            lucide.createIcons();

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                
                const qrContainer = document.getElementById('realQRCodeContainer');
                qrContainer.innerHTML = "";
                new QRCode(qrContainer, {
                    text: `NETWISH_SECURE_PAY:${currentUser.id}:${currentUser.email}`,
                    width: 160,
                    height: 160,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            }, 10);
        }

        const modal = document.getElementById('customModal');
        const modalContent = document.getElementById('modalContent');
        const modalBody = document.getElementById('modalBody');
        let currentStream = null;

        function openModal(sectionName) {
            stopCamera();
            document.getElementById('modalCloseBtn').style.display = 'block';
            modalBody.innerHTML = `
                <div class="w-14 h-14 rounded-2xl bg-neutral-100 flex items-center justify-center mx-auto text-black">
                    <i data-lucide="clock" class="w-6 h-6"></i>
                </div>
                <div class="space-y-1">
                    <h3 class="text-base font-bold text-black">${sectionName} — Próximamente</h3>
                    <p class="text-xs text-neutral-500">Este módulo avanzado de NetWish estará disponible muy pronto.</p>
                </div>
            `;
            lucide.createIcons();

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
            }, 10);
        }

        async function startCameraModal() {
            document.getElementById('modalCloseBtn').style.display = 'block';
            modalBody.innerHTML = `
                <div class="space-y-3">
                    <h3 class="text-base font-bold text-black">Escaneando Código QR</h3>
                    <div class="w-full h-80 bg-black rounded-2xl overflow-hidden relative flex items-center justify-center shadow-inner">
                        <video id="cameraPreview" autoplay playsinline class="w-full h-full object-cover"></video>
                        <div class="absolute inset-0 border-2 border-white/30 m-6 rounded-xl pointer-events-none flex items-center justify-center">
                            <div class="w-36 h-36 border-2 border-white rounded-xl animate-pulse"></div>
                        </div>
                    </div>
                    <p class="text-xs text-neutral-400">Apunta el código QR del comercio o mesa.</p>
                </div>
            `;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
            }, 10);

            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                const videoElement = document.getElementById('cameraPreview');
                if (videoElement) {
                    videoElement.srcObject = currentStream;
                }
            } catch (error) {
                console.error("Error al acceder a la cámara:", error);
                alert("No se pudo acceder a la cámara. Asegúrate de dar permisos en tu navegador.");
                closeModal();
            }
        }

        function stopCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
        }

        function closeModal() {
            stopCamera();
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function switchTab(tabId) {
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-explore').classList.add('hidden');
            document.getElementById('view-scan').classList.add('hidden');
            document.getElementById('view-profile').classList.add('hidden');

            document.getElementById('view-' + tabId).classList.remove('hidden');

            if (tabId === 'profile') {
                renderProfileView();
            }

            document.getElementById('nav-home').className = "flex flex-col items-center text-neutral-400 hover:text-black transition space-y-1 group";
            document.getElementById('nav-explore').className = "flex flex-col items-center text-neutral-400 hover:text-black transition space-y-1 group";
            document.getElementById('nav-scan').className = "flex flex-col items-center text-neutral-400 hover:text-black transition space-y-1 group";
            document.getElementById('nav-profile').className = "flex flex-col items-center text-neutral-400 hover:text-black transition space-y-1 group";

            document.getElementById('nav-' + tabId).className = "flex flex-col items-center text-black space-y-1 transition group";
        }
    </script>
</body>
</html>
