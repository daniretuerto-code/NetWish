<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NetWish — Palencia</title>

    <!-- PWA / Pantalla completa móvil -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0a0a0a',
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { 
            background-color: #ffffff; 
            color: #171717; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex justify-center items-center">

    <!-- Contenedor Principal App Shell -->
    <div class="w-full h-full sm:max-w-md sm:h-[844px] sm:rounded-3xl bg-white sm:border sm:border-neutral-200 flex flex-col shadow-2xl overflow-hidden relative">
        
        <!-- Header Superior Fijo -->
        <header class="absolute top-0 left-0 right-0 px-5 pt-4 pb-3 border-b border-neutral-100 flex justify-between items-center bg-white/95 backdrop-blur-md z-30">
            <h1 class="text-2xl font-bold tracking-tight text-black font-serif italic">NetWish</h1>
            <div class="w-9 h-9 rounded-full bg-neutral-100 border border-neutral-200 flex items-center justify-center text-xs font-semibold text-neutral-800 shadow-sm">
                DR
            </div>
        </header>

        <!-- Contenido Desplazable (Con padding superior e inferior para no chocar con las barras fijas) -->
        <main class="flex-1 overflow-y-auto no-scrollbar px-5 pt-20 pb-24 space-y-6">
            
            <!-- Barra de Búsqueda Centrada -->
            <section class="pt-2">
                <div class="relative flex items-center shadow-sm">
                    <i data-lucide="search" class="absolute left-4 w-4 h-4 text-neutral-400"></i>
                    <input type="text" placeholder="Buscar comercios, servicios..." class="w-full bg-neutral-50 border border-neutral-200 rounded-xl py-3 pl-11 pr-4 text-sm text-black placeholder-neutral-400 focus:outline-none focus:border-black transition">
                </div>
            </section>

            <!-- Acceso Directo Destacado: Escáner QR de Pagos -->
            <section class="p-5 rounded-2xl bg-black text-white flex flex-col justify-between space-y-4 shadow-xl">
                <div class="flex justify-between items-start">
                    <div>
                        <span class="text-[10px] text-neutral-400 font-mono tracking-wider">PAGO RÁPIDO URBANO</span>
                        <h2 class="text-base font-semibold tracking-tight mt-0.5 text-white">Escanea para Pagar</h2>
                    </div>
                    <i data-lucide="qr-code" class="w-6 h-6 text-neutral-200"></i>
                </div>
                <button onclick="alert('Abriendo escáner de pagos NetWish...')" class="w-full py-3 bg-white text-black font-medium rounded-xl text-sm transition hover:bg-neutral-200 active:scale-[0.98]">
                    Abrir Escáner
                </button>
            </section>

            <!-- Muestra Rápida: Panadería en Directo (Click & Collect) -->
            <section class="space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="text-[10px] font-mono uppercase tracking-wider text-neutral-500">Panadería Recomendada</h3>
                    <span class="text-[10px] text-emerald-600 font-mono bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200">Stock en vivo</span>
                </div>
                
                <div class="p-4 rounded-2xl bg-neutral-900 text-white space-y-3 shadow-md">
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="text-sm font-medium text-white">Obrador La Clau</h4>
                            <p class="text-xs text-neutral-400 mt-0.5">Calle Mayor • A 300m</p>
                        </div>
                        <i data-lucide="croissant" class="w-5 h-5 text-amber-400"></i>
                    </div>
                    <div class="pt-3 border-t border-neutral-800 flex justify-between items-center">
                        <span class="text-xs text-neutral-400">Baguette Rústica: <strong class="text-white">14 disp.</strong></span>
                        <button onclick="alert('¡Reserva realizada con éxito!')" class="px-3 py-1.5 bg-white text-black hover:bg-neutral-200 text-xs font-medium rounded-lg transition active:scale-95">
                            Reservar
                        </button>
                    </div>
                </div>
            </section>

            <!-- Categorías de la Ciudad -->
            <section class="space-y-3">
                <h3 class="text-[10px] font-mono uppercase tracking-wider text-neutral-500">Categorías de la Ciudad</h3>
                <div class="grid grid-cols-2 gap-3">
                    <!-- Infraestructuras -->
                    <button onclick="alert('Sección Infraestructuras')" class="flex items-center space-x-3 p-3.5 rounded-2xl bg-neutral-50 border border-neutral-200 hover:border-neutral-300 transition text-left">
                        <div class="w-9 h-9 rounded-xl bg-blue-50 flex items-center justify-center shrink-0">
                            <i data-lucide="building-2" class="w-5 h-5 text-blue-600"></i>
                        </div>
                        <div>
                            <span class="block text-xs font-semibold text-black">Infraestructuras</span>
                            <span class="block text-[10px] text-neutral-500">Piscinas, bus...</span>
                        </div>
                    </button>

                    <!-- Comercios -->
                    <button onclick="alert('Sección Comercios')" class="flex items-center space-x-3 p-3.5 rounded-2xl bg-neutral-50 border border-neutral-200 hover:border-neutral-300 transition text-left">
                        <div class="w-9 h-9 rounded-xl bg-amber-50 flex items-center justify-center shrink-0">
                            <i data-lucide="store" class="w-5 h-5 text-amber-600"></i>
                        </div>
                        <div>
                            <span class="block text-xs font-semibold text-black">Comercios</span>
                            <span class="block text-[10px] text-neutral-500">Pan, stock, etc</span>
                        </div>
                    </button>

                    <!-- Restaurantes -->
                    <button onclick="alert('Sección Restaurantes')" class="flex items-center space-x-3 p-3.5 rounded-2xl bg-neutral-50 border border-neutral-200 hover:border-neutral-300 transition text-left">
                        <div class="w-9 h-9 rounded-xl bg-rose-50 flex items-center justify-center shrink-0">
                            <i data-lucide="utensils" class="w-5 h-5 text-rose-600"></i>
                        </div>
                        <div>
                            <span class="block text-xs font-semibold text-black">Restaurantes</span>
                            <span class="block text-[10px] text-neutral-500">QR mesa, cuenta</span>
                        </div>
                    </button>

                    <!-- Movilidad -->
                    <button onclick="alert('Sección Movilidad')" class="flex items-center space-x-3 p-3.5 rounded-2xl bg-neutral-50 border border-neutral-200 hover:border-neutral-300 transition text-left">
                        <div class="w-9 h-9 rounded-xl bg-emerald-50 flex items-center justify-center shrink-0">
                            <i data-lucide="car" class="w-5 h-5 text-emerald-600"></i>
                        </div>
                        <div>
                            <span class="block text-xs font-semibold text-black">Movilidad</span>
                            <span class="block text-[10px] text-neutral-500">Taxis y bus GPS</span>
                        </div>
                    </button>
                </div>

                <!-- Ocio -->
                <button onclick="alert('Sección Ocio')" class="w-full flex items-center justify-between p-3.5 rounded-2xl bg-neutral-50 border border-neutral-200 hover:border-neutral-300 transition text-left">
                    <div class="flex items-center space-x-3">
                        <div class="w-9 h-9 rounded-xl bg-purple-50 flex items-center justify-center shrink-0">
                            <i data-lucide="sparkles" class="w-5 h-5 text-purple-600"></i>
                        </div>
                        <div>
                            <span class="block text-xs font-semibold text-black">Ocio y Experiencias</span>
                            <span class="block text-[10px] text-neutral-500">Eventos y actividades en Palencia</span>
                        </div>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-neutral-400"></i>
                </button>
            </section>

        </main>

        <!-- Barra de Navegación Inferior Fija (Inicio, Explorar, Scan, Perfil) -->
        <nav class="absolute bottom-0 left-0 right-0 border-t border-neutral-200 bg-white/95 backdrop-blur-md px-4 py-3 flex justify-around items-center z-30 shadow-lg">
            <button class="flex flex-col items-center text-black space-y-1">
                <i data-lucide="home" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium tracking-tight">Inicio</span>
            </button>
            <button class="flex flex-col items-center text-neutral-400 hover:text-black transition space-y-1">
                <i data-lucide="compass" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium tracking-tight">Explorar</span>
            </button>
            <button class="flex flex-col items-center text-neutral-400 hover:text-black transition space-y-1">
                <i data-lucide="scan" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium tracking-tight">Scan</span>
            </button>
            <button class="flex flex-col items-center text-neutral-400 hover:text-black transition space-y-1">
                <i data-lucide="user" class="w-5 h-5"></i>
                <span class="text-[10px] font-medium tracking-tight">Perfil</span>
            </button>
        </nav>

    </div>

    <!-- Inicializar iconos Lucide -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
