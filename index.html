<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Viewport adaptativo para móviles con notch -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NetWish — Palencia</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Eliminación de resaltado de tap nativo y scroll invisible */
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background-color: #f5f5f7; min-height: 100dvh; display: flex; justify-content: center; align-items: center; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <!-- Contenedor App Shell: Estructura centrada tipo móvil -->
    <div class="w-full h-[100dvh] sm:h-[844px] sm:max-w-[390px] sm:rounded-[40px] bg-white flex flex-col relative shadow-2xl overflow-hidden sm:border sm:border-neutral-300">
        
        <!-- Header: Fijo en el tope, con blur de fondo para elegancia -->
        <header class="absolute top-0 left-0 right-0 px-6 pt-14 pb-4 border-b border-neutral-100 flex justify-between items-center bg-white/95 backdrop-blur-md z-30 shadow-sm">
            <h1 class="text-2xl font-bold tracking-tight text-black font-serif italic">NetWish</h1>
            <div class="w-9 h-9 rounded-full bg-neutral-100 border border-neutral-200 flex items-center justify-center text-xs font-semibold text-neutral-800">DR</div>
        </header>

        <!-- Contenido principal con padding para no solaparse con cabeceras fijas -->
        <main class="flex-1 overflow-y-auto no-scrollbar px-6 pt-28 pb-28 space-y-8">
            
            <!-- SECCIÓN EXPLORAR: Buscador inteligente -->
            <section id="explore-view" class="space-y-4">
                <h2 class="text-xl font-bold text-black">Explorar</h2>
                <div class="relative flex items-center shadow-sm">
                    <i data-lucide="search" class="absolute left-4 w-4 h-4 text-neutral-400"></i>
                    <input type="text" placeholder="Buscar servicios en Palencia..." class="w-full bg-neutral-50 border border-neutral-200 rounded-xl py-3 pl-11 pr-4 text-sm focus:outline-none focus:border-black transition">
                </div>
            </section>

            <!-- SECCIÓN CATEGORÍAS: Integración de tarjetas -->
            <section class="space-y-3">
                <h3 class="text-[10px] font-mono uppercase tracking-wider text-neutral-500">Servicios rápidos</h3>
                <div class="grid grid-cols-2 gap-3">
                    <!-- Ejemplo de componente reutilizable de botón -->
                    <button onclick="openModal('Peluquería')" class="flex items-center space-x-3 p-3.5 rounded-2xl bg-neutral-50 border border-neutral-200 hover:border-neutral-300 transition text-left active:scale-95">
                        <div class="w-9 h-9 rounded-xl bg-blue-50 flex items-center justify-center shrink-0">
                            <i data-lucide="scissors" class="w-5 h-5 text-blue-600"></i>
                        </div>
                        <span class="text-xs font-semibold text-black">Peluquería</span>
                    </button>
                    <!-- Añade más botones siguiendo este patrón -->
                </div>
            </section>

        </main>

        <!-- Navegación: Posicionamiento absoluto para consistencia -->
        <nav class="absolute bottom-0 left-0 right-0 border-t border-neutral-200 bg-white/95 backdrop-blur-md px-4 py-3 flex justify-around items-center z-30 shadow-lg">
            <button class="flex flex-col items-center text-black space-y-1"><i data-lucide="home" class="w-5 h-5"></i><span class="text-[10px] font-medium">Inicio</span></button>
            <button class="flex flex-col items-center text-black space-y-1"><i data-lucide="compass" class="w-5 h-5"></i><span class="text-[10px] font-medium">Explorar</span></button>
            <button class="flex flex-col items-center text-neutral-400 space-y-1"><i data-lucide="scan" class="w-5 h-5"></i><span class="text-[10px] font-medium">Scan</span></button>
            <button class="flex flex-col items-center text-neutral-400 space-y-1"><i data-lucide="user" class="w-5 h-5"></i><span class="text-[10px] font-medium">Perfil</span></button>
        </nav>

        <!-- Modal: Componente de aviso genérico para funcionalidades futuras -->
        <div id="customModal" class="absolute inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-6 hidden opacity-0 transition-opacity duration-300">
            <div class="bg-white w-full max-w-xs rounded-3xl p-6 text-center shadow-2xl scale-95 transition-transform duration-300" id="modalContent">
                <h3 id="modalTitle" class="text-base font-semibold text-black mb-2">Próximamente</h3>
                <button onclick="closeModal()" class="w-full py-3 bg-black text-white rounded-xl text-sm">OK</button>
            </div>
        </div>
    </div>

    <script>
        // Inicialización de iconos y funciones de UI
        lucide.createIcons();
        const modal = document.getElementById('customModal');
        
        function openModal(name) {
            document.getElementById('modalTitle').innerText = name + " — Próximamente";
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); }, 10);
        }

        function closeModal() {
            modal.classList.add('opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }
    </script>
</body>
</html>
